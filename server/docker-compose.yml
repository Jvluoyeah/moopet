# 养成系机械狗 · 服务端 compose
#
# 构建上下文是**仓库根目录**（服务端要一起打包构建好的前端与引擎脚本），
# 所以 compose 需要在 server/ 目录下运行：
#
#     cd server && docker compose up --build
#     或：docker compose -f server/docker-compose.yml up --build
#
# 本地（默认，SQLite）：
#     docker compose up --build
#     → http://localhost:8080/          （页面 + API 同源）
#
# 云端 Ubuntu（PostgreSQL）：
#     MOOPET_SECRET_KEY=$(openssl rand -hex 32) docker compose --profile cloud up -d --build
#     再按 docs/UBUNTU_运行指南.md 在前面挂 Nginx + TLS
#
# 注意：多进程（--workers > 1）时对战房间在内存里，必须配 Redis 才能跨进程；
#       演示阶段固定单进程，见文档说明。

services:
  api:
    build:
      # 以本 compose 文件所在目录（server/）为基准，上两级才是仓库根
      context: ../..
      dockerfile: server/docker/Dockerfile
      args:
        INCLUDE_GAL: ${INCLUDE_GAL:-0}
    image: moopet-server:latest
    container_name: moopet-api
    restart: unless-stopped
    ports:
      - "${MOOPET_PUBLISH_PORT:-8080}:8080"
    environment:
      MOOPET_HOST: 0.0.0.0
      MOOPET_PORT: 8080
      MOOPET_DATABASE_URL: ${MOOPET_DATABASE_URL:-sqlite:////data/moopet.db}
      MOOPET_SECRET_KEY: ${MOOPET_SECRET_KEY:-moopet-dev-only-secret-change-me-in-production-32b}
      MOOPET_ALLOW_ORIGINS: ${MOOPET_ALLOW_ORIGINS:-*}
      MOOPET_TOKEN_TTL_HOURS: ${MOOPET_TOKEN_TTL_HOURS:-72}
      MOOPET_SEED_DEMO: ${MOOPET_SEED_DEMO:-1}
      # 剧情模式：容器里没有 gal 素材（默认不打进镜像），/gal/* 代理到上游。
      # 想让容器自己带素材：--build-arg INCLUDE_GAL=1 并把 gal 起在容器内。
      MOOPET_GAL_UPSTREAM: ${MOOPET_GAL_UPSTREAM:-http://127.0.0.1:18080}
    volumes:
      - ../server/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 云端档位：需要 PostgreSQL 时启用（--profile cloud）
  db:
    image: postgres:16-alpine
    container_name: moopet-db
    profiles: ["cloud"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moopet}
      POSTGRES_USER: ${POSTGRES_USER:-moopet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moopet}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
