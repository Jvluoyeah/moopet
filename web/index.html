  <!-- 霞鹜文楷 Bright：cn-font-split 切好的 unicode-range 子集，浏览器只下命中的那几段。
       用 /fonts/… 这种**根路径**：它在 public/ 下，Vite 不该（也解析不了）在构建期处理它，
       写相对路径会报 "doesn't exist at build time"。部署时后端就是挂在根上的。
       世界里的招牌/名牌是用 Canvas 画字的，所以 main.js 会先等字体就绪再建场景。 -->
  <link rel="stylesheet" href="/fonts/lxgw-bright/font.css" />
